<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Gestion de Barrio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-sm rounded-2xl p-8 shadow-xl space-y-6">
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-bold text-gray-800">Mi Barrio</h1>
            <p class="text-xs text-gray-500">Ingresa a tu portal de gestion</p>
        </div>

        <form id="form-login" onsubmit="iniciarSesion(event)" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-semibold text-gray-600 mb-1">Correo electronico</label>
                <input type="email" id="email" placeholder="tu@email.com" class="w-full border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-gray-600 mb-1">Contrasena</label>
                <input type="password" id="password" placeholder="********" class="w-full border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>

            <div id="error-msg" class="text-xs text-red-600 font-medium hidden text-center"></div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow">
                Ingresar
            </button>

            <button type="button" onclick="abrirModalReset()" class="w-full text-xs text-blue-600 hover:text-blue-800 font-medium">
                Olvide mi contrasena
            </button>
        </form>
    </div>

    <div id="modal-reset" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl space-y-4">
            <div>
                <h3 class="font-bold text-gray-800">Recuperar contrasena</h3>
                <p class="text-xs text-gray-500 mt-1">Te enviaremos un codigo de verificacion al email.</p>
            </div>

            <div class="space-y-3">
                <label for="reset-email" class="sr-only">Email de recuperacion</label>
                <input id="reset-email" type="email" placeholder="Email" class="w-full border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-slate-500">

                <div class="flex gap-2">
                    <label for="reset-codigo" class="sr-only">Codigo de verificacion</label>
                    <input id="reset-codigo" type="text" maxlength="6" placeholder="Codigo de 6 digitos" class="flex-1 border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-slate-500">
                    <button type="button" onclick="solicitarCodigo()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 rounded-lg text-xs font-semibold">
                        Enviar codigo
                    </button>
                </div>

                <button type="button" onclick="verificarCodigo()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-xs font-semibold">
                    Verificar codigo
                </button>

                <label for="reset-pass" class="sr-only">Nueva contrasena</label>
                <input id="reset-pass" type="password" placeholder="Nueva contrasena" class="w-full border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-slate-500" disabled>
                <label for="reset-pass2" class="sr-only">Repetir nueva contrasena</label>
                <input id="reset-pass2" type="password" placeholder="Repetir nueva contrasena" class="w-full border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-slate-500" disabled>
            </div>

            <div id="reset-msg" class="text-xs hidden"></div>

            <div class="flex gap-2">
                <button type="button" onclick="cerrarModalReset()" class="flex-1 border rounded-lg py-2 text-sm hover:bg-gray-50">Cancelar</button>
                <button type="button" onclick="confirmarReset()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 text-sm font-semibold">
                    Cambiar contrasena
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'index.php?route=';
        let codigoVerificado = false;

        function buildApiUrl(path) {
            return `${API_URL}${path}`;
        }

        async function iniciarSesion(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');

            errorDiv.classList.add('hidden');

            try {
                const response = await fetch(buildApiUrl('/auth/login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('usuario', JSON.stringify(result.usuario));

                    const rol = result.usuario.rol;
                    if (rol === 'intendente' || rol === 'admin_general') {
                        window.location.href = 'intendente.html';
                    } else {
                        window.location.href = 'vecino.html';
                    }
                } else {
                    errorDiv.innerText = result.error || 'Credenciales invalidas';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error de red:', error);
                errorDiv.innerText = 'Error de conexion con el servidor';
                errorDiv.classList.remove('hidden');
            }
        }

        function abrirModalReset() {
            const modal = document.getElementById('modal-reset');
            const email = document.getElementById('email').value.trim();

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            document.getElementById('reset-email').value = email;
            document.getElementById('reset-codigo').value = '';
            document.getElementById('reset-pass').value = '';
            document.getElementById('reset-pass2').value = '';

            codigoVerificado = false;
            setPasswordInputsEnabled(false);
            ocultarMsgReset();
        }

        function cerrarModalReset() {
            const modal = document.getElementById('modal-reset');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function setPasswordInputsEnabled(enabled) {
            document.getElementById('reset-pass').disabled = !enabled;
            document.getElementById('reset-pass2').disabled = !enabled;
        }

        function mostrarMsgReset(texto, ok) {
            const el = document.getElementById('reset-msg');
            el.classList.remove('hidden');
            el.className = ok ? 'text-xs text-emerald-600' : 'text-xs text-red-600';
            el.innerText = texto;
        }

        function ocultarMsgReset() {
            const el = document.getElementById('reset-msg');
            el.className = 'text-xs hidden';
            el.innerText = '';
        }

        async function solicitarCodigo() {
            const email = document.getElementById('reset-email').value.trim();
            codigoVerificado = false;
            setPasswordInputsEnabled(false);

            if (!email) {
                mostrarMsgReset('Ingresa un email valido.', false);
                return;
            }

            try {
                const response = await fetch(buildApiUrl('/auth/password/request-code'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email: email })
                });

                const result = await response.json();

                if (response.ok) {
                    mostrarMsgReset(result.message || 'Si el email existe, se envio un codigo.', true);
                } else {
                    mostrarMsgReset(result.error || 'No se pudo enviar el codigo.', false);
                }
            } catch (error) {
                console.error('Error al solicitar codigo:', error);
                mostrarMsgReset('Error de conexion con el servidor.', false);
            }
        }

        async function verificarCodigo() {
            const email = document.getElementById('reset-email').value.trim();
            const codigo = document.getElementById('reset-codigo').value.trim();
            codigoVerificado = false;
            setPasswordInputsEnabled(false);

            if (!email || !/^\d{6}$/.test(codigo)) {
                mostrarMsgReset('Ingresa email y un codigo de 6 digitos.', false);
                return;
            }

            try {
                const response = await fetch(buildApiUrl('/auth/password/verify-code'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email: email, codigo: codigo })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    codigoVerificado = true;
                    setPasswordInputsEnabled(true);
                    mostrarMsgReset('Codigo verificado. Ahora ingresa tu nueva contrasena.', true);
                } else {
                    mostrarMsgReset(result.error || 'Codigo invalido o expirado.', false);
                }
            } catch (error) {
                console.error('Error al verificar codigo:', error);
                mostrarMsgReset('Error de conexion con el servidor.', false);
            }
        }

        async function confirmarReset() {
            const email = document.getElementById('reset-email').value.trim();
            const codigo = document.getElementById('reset-codigo').value.trim();
            const newPassword = document.getElementById('reset-pass').value;
            const confirmPassword = document.getElementById('reset-pass2').value;

            if (!codigoVerificado) {
                mostrarMsgReset('Primero debes verificar el codigo.', false);
                return;
            }

            if (!newPassword || !confirmPassword) {
                mostrarMsgReset('Completa la nueva contrasena y su confirmacion.', false);
                return;
            }

            try {
                const response = await fetch(buildApiUrl('/auth/password/reset'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        email: email,
                        codigo: codigo,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    mostrarMsgReset('Contrasena actualizada con exito. Ya puedes iniciar sesion.', true);
                    setTimeout(() => {
                        cerrarModalReset();
                    }, 1200);
                } else {
                    mostrarMsgReset(result.error || 'No se pudo cambiar la contrasena.', false);
                }
            } catch (error) {
                console.error('Error al cambiar contrasena:', error);
                mostrarMsgReset('Error de conexion con el servidor.', false);
            }
        }
    </script>
</body>
</html>
